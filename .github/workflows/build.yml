name: SnapNotify tests and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapnotify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: C core regression tests and sanitizers
        run: bash scripts/test-portable.sh
  ios-build:
    needs: portable-tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Foundation adapters and inherited-hook tests
        run: bash scripts/test-macos.sh
      - name: Build arm64 library using the runner's Xcode SDK
        run: bash scripts/build-macos.sh
      - name: Upload dylib and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SnapNotify-v4-dylib
          path: |
            out/SnapNotify.dylib
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
