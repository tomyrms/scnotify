name: SnapNotify rc5.1 forward repair validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply readable source edits with before and after hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          changes=json.loads(pathlib.Path('.ci/rc5_1-edits.json').read_text())
          for name,spec in changes.items():
              p=pathlib.Path(name)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==spec['before_sha256'],name+' base mismatch'
              lines=p.read_text().splitlines(keepends=True)
              for start,end,text in reversed(spec['replacements']):
                  lines[start:end]=text.splitlines(keepends=True)
              out=''.join(lines).encode()
              assert hashlib.sha256(out).hexdigest()==spec['after_sha256'],name+' edited mismatch'
              p.write_bytes(out)
          expected={
            'Sources/SNDeliveryQueue.h':'e509da12857283fd39196c986da2b93e6ca9ca1da227f453c623b602d4c61bc5',
            'Sources/SNDeliveryQueue.m':'879f5fb0fb229fd892169dd7a7e6ab589a471b8e3747e9d80592e2482f4c47a9',
            'tests/TestDeliveryQueue.m':'9e40e7f183b759641685425ca97734f6ac6bc28fdb9f4fa1f024b5e11c27cc88'}
          for name,wanted in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==wanted,name+' new file mismatch'
          PY
          python3 .ci/finalize_rc5_1.py
      - name: Portable regression and sanitizers
        run: bash scripts/test-portable.sh
      - name: Native tests including blocked disk and continuous input
        run: bash scripts/test-macos.sh
      - name: Build current arm64 library
        run: bash scripts/build-macos.sh
      - name: Record exact source hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          paths=[pathlib.Path('Tweak.m'),pathlib.Path('Makefile')]
          paths += [p for folder in ('Core','Sources','scripts','tests') for p in pathlib.Path(folder).rglob('*') if p.is_file() and '__pycache__' not in str(p)]
          report={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}
          pathlib.Path('out/SOURCE_HASHES.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SnapNotify-rc5.1-repair
          path: |
            out/SnapNotify.dylib
            out/SHA256SUMS.txt
            out/SOURCE_HASHES.json
          if-no-files-found: error
          retention-days: 14
