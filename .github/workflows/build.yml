name: SnapNotify rc5 isolated validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc5-validation:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and apply the readable integration patch
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          p = pathlib.Path('.ci/rc5-integration.patch')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '1ffce9ccb472f8326df642957f13a46e5369f6a04a512ed8a30185dc5338b993'
          subprocess.run(['git','apply','--check','--unidiff-zero',str(p)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(p)],check=True)
          PY
      - name: Portable tests and sanitizers
        run: bash scripts/test-portable.sh
      - name: Foundation, voice, large batches and durable queue tests
        run: bash scripts/test-macos.sh
      - name: Compile arm64 library
        run: bash scripts/build-macos.sh
      - name: Record exact compiled sources
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          paths = ['Tweak.m','Makefile'] + [str(p) for folder in ('Sources','Core','scripts','tests') for p in root.joinpath(folder).rglob('*') if p.is_file() and '__pycache__' not in str(p)]
          report = {p:hashlib.sha256(root.joinpath(p).read_bytes()).hexdigest() for p in sorted(paths)}
          print(json.dumps(report,indent=2))
          pathlib.Path('out/SOURCE_HASHES.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SnapNotify-rc5-validated
          path: |
            out/SnapNotify.dylib
            out/SHA256SUMS.txt
            out/SOURCE_HASHES.json
          if-no-files-found: error
          retention-days: 14
